name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-engine.js
      - run: node scripts/verify.js
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright && npx playwright install --with-deps chromium
      - run: node scripts/ui-smoke.js
