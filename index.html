<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e1020">
  <title>Axiom — כל כלי הוא חוק</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 100 100"><polygon points="50,8 92,50 50,92 8,50" fill="none" stroke="currentColor" stroke-width="8" stroke-linejoin="round"/><circle cx="50" cy="50" r="13" fill="currentColor"/></svg></span>
      <div>
        <h1>AXIOM</h1>
        <p>כל כלי הוא חוק</p>
      </div>
    </div>
    <nav id="levels" aria-label="רמות"></nav>
  </header>

  <main class="layout">
    <section class="stage" aria-label="לוח המשחק">
      <div class="card intro" id="intro"></div>
      <div class="boardwrap"><div id="board" role="grid" aria-label="לוח"></div></div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div id="tray" class="tray" aria-label="מגש כלים"></div>
      <div class="actions">
        <button id="hint" class="btn">💡 רמז</button>
        <button id="reset" class="btn ghostbtn">↺ אפס רמה</button>
      </div>
    </section>

    <aside class="side" aria-label="חוקים ודוגמאות">
      <div class="card" id="rules"></div>
      <div class="card" id="examples" hidden></div>
    </aside>
  </main>

  <footer class="foot">אב-טיפוס · לכל רמה פתרון יחיד שנבדק אוטומטית</footer>

  <div id="modal" class="modal" hidden></div>

  <script src="src/engine.js"></script>
  <script src="src/levels.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
